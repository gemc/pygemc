name: Trigger GEMC compatibility test

# Fires the compatibility-test workflow in gemc/src whenever main is pushed.
# Requires a repository secret named GEMC_SRC_PAT that holds a GitHub Personal
# Access Token with the `workflow` scope granted on the gemc/src repository.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"

jobs:
  trigger-docker-deploy:
    name: Dispatch Test gemc/src
    runs-on: ubuntu-latest

    steps:
      - name: Trigger GEMC compatibility test
        run: |
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GEMC_SRC_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/gemc/src/actions/workflows/test_after_pygemc.yml/dispatches \
            -d '{"ref":"main","inputs":{"triggered_by":"Triggered by pygemc"}}'
